# Local development database only.
# The password below is a throwaway development value, not a secret.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih_dev_password
      POSTGRES_DB: sih_aicte
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sih_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih -d sih_aicte"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sih_pgdata:
