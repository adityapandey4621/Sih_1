# nginx for the web container. TLS is terminated in FRONT of this (a load balancer, Caddy, a platform router): see docs/DEPLOYMENT.md.
# The upstream is the API container named "api" on the compose network.

limit_req_zone $binary_remote_addr zone=api_all:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    # Headers for the SPA. The API sets its own (restrictive) policy on its responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sign-in and invitation endpoints: tighter than the rest (the API applies its own limits as well).
    # (Any add_header in a location stops the server-level ones being added again: the API's own security headers pass through once.)
    location ~ ^/api/(auth/login|auth/invitations|access-requests) {
        add_header X-Served-By "sih-web" always;
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    location /api/ {
        add_header X-Served-By "sih-web" always;
        limit_req zone=api_all burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # Hashed build assets are immutable; index.html is never cached so a release takes effect at once.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri /index.html;
    }
}
